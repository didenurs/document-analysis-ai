<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-3xl w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl p-8 neon-glow">
        <h1 class="text-3xl font-extrabold text-center text-white mb-2 neon-text">AI Document Analyzer 🤖</h1>
        <p class="text-center text-slate-400 mb-6">PDF yükleyin veya doğrudan metin analizi yapın</p>

        <!-- Sekme veya Seçim Ayracı -->
        <div class="flex border-b border-slate-800 mb-6">
            <button id="tab-pdf" class="flex-1 py-2 font-semibold text-blue-400 border-b-2 border-blue-500 focus:outline-none transition-all">PDF Yükle</button>
            <button id="tab-text" class="flex-1 py-2 font-semibold text-slate-500 border-b-2 border-transparent focus:outline-none transition-all">Metin Yapıştır</button>
        </div>

        <!-- 1. Mod: PDF Sürükle Bırak Alanı -->
        <div id="pdf-section">
            <div id="drop-zone" class="border-4 border-dashed border-slate-700 rounded-xl p-12 text-center cursor-pointer hover:border-blue-500 hover:bg-slate-800/50 transition-all duration-300">
                <svg class="mx-auto h-12 w-12 text-blue-400 mb-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-lg text-slate-200 font-medium">Dosyayı buraya sürükleyin</p>
                <p class="text-sm text-slate-400 mt-2">veya tıklayarak seçin (Sadece PDF)</p>
                <input type="file" id="file-input" class="hidden" accept=".pdf">
            </div>
        </div>

        <!-- 2. Mod: Metin Giriş Alanı (Başlangıçta Gizli) -->
        <div id="text-section" class="hidden">
            <textarea id="text-input" rows="6" class="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-200 placeholder-slate-500" placeholder="Analiz edilmesini istediğiniz metni buraya yapıştırın..."></textarea>
            <button id="analyze-text-btn" class="mt-4 w-full py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-500 transition font-medium shadow-lg shadow-blue-600/30">Metni Analiz Et</button>
        </div>

        <!-- Yükleme Animasyonu -->
        <div id="loader" class="hidden mt-8 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400"></div>
            <p class="text-blue-400 font-medium mt-2">Yapay Zeka Analiz Ediyor...</p>
        </div>

        <!-- Sonuç Alanı -->
        <div id="results" class="hidden mt-8 space-y-6 animate-fade-in">
            <!-- Dinamik olarak JS ile doldurulacak -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
